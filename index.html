<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สแกนเข้ากอง - ออกกอง</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@700&family=Noto+Sans+Thai:wght@700&display=swap">
<style>
:root{--bg:#07040f;--p:#a855f7;--p2:#7c3aed;--p3:#d8b4fe;--glass:rgba(168,85,247,.10);--line:rgba(196,140,255,.28);--ok:#4ade80;--out:#fb7185;--tx:#f5eeff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:radial-gradient(1200px 700px at 50% -10%,#2a0f55,var(--bg) 60%) fixed,var(--bg);color:var(--tx);font-family:'Google Sans','Noto Sans Thai',sans-serif;font-weight:700;min-height:100vh;overflow-x:hidden;position:relative}
/* grid */
.grid{position:fixed;inset:-50% -50% 0 -50%;top:30%;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;transform:perspective(500px) rotateX(62deg);animation:gm 3s linear infinite;mask-image:linear-gradient(transparent,#000 50%);-webkit-mask-image:linear-gradient(transparent,#000 50%);z-index:0}
@keyframes gm{to{background-position:0 56px}}
.bubble{position:fixed;bottom:-120px;border-radius:50%;background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.55),rgba(168,85,247,.25) 40%,rgba(124,58,237,.08));border:1px solid rgba(216,180,254,.35);box-shadow:inset 0 0 18px rgba(216,180,254,.25),0 0 24px rgba(168,85,247,.25);animation:rise linear infinite;z-index:0}
@keyframes rise{0%{transform:translate(0,0) scale(.6);opacity:0}10%{opacity:1}50%{transform:translate(30px,-55vh) scale(1)}100%{transform:translate(-20px,-120vh) scale(1.1);opacity:0}}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:24px 16px 60px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:24px;backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:0 10px 40px rgba(60,10,120,.45),inset 0 1px 0 rgba(255,255,255,.12)}
h1{font-size:clamp(26px,5vw,40px);background:linear-gradient(90deg,#fff,var(--p3),var(--p));-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center}
.sub{text-align:center;color:var(--p3);opacity:.8;margin-top:6px;font-size:14px}
.pop{animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.9)}to{opacity:1;transform:none}}
/* login */
#login{max-width:420px;margin:12vh auto 0;padding:34px 26px;text-align:center}
.logo{width:84px;height:84px;margin:0 auto 18px;border-radius:26px;display:grid;place-items:center;font-size:38px;background:linear-gradient(135deg,var(--p),var(--p2));box-shadow:0 0 40px rgba(168,85,247,.7);animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px) rotate(4deg)}}
input{width:100%;margin-top:22px;padding:16px;border-radius:16px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:#fff;font:inherit;font-size:24px;text-align:center;letter-spacing:8px;outline:none;transition:.25s}
input:focus{border-color:var(--p);box-shadow:0 0 0 4px rgba(168,85,247,.25),0 0 30px rgba(168,85,247,.4)}
.btn{position:relative;overflow:hidden;margin-top:16px;width:100%;padding:16px;border:0;border-radius:16px;color:#fff;font:inherit;font-size:18px;cursor:pointer;background:linear-gradient(135deg,var(--p),var(--p2));box-shadow:0 8px 28px rgba(124,58,237,.55);transition:.25s}
.btn:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 12px 36px rgba(168,85,247,.75)}
.btn:active{transform:scale(.97)}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);animation:shine 2.8s infinite}
@keyframes shine{to{transform:translateX(120%)}}
.btn.out{background:linear-gradient(135deg,#f43f5e,#a21caf);box-shadow:0 8px 28px rgba(244,63,94,.5)}
.err{color:var(--out);margin-top:12px;min-height:22px;font-size:14px}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
/* app */
#app{display:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 20px;margin-bottom:18px}
.clock{font-size:clamp(20px,4vw,28px);color:var(--p3);font-variant-numeric:tabular-nums;text-shadow:0 0 18px var(--p)}
.me{display:flex;gap:14px;align-items:center}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:linear-gradient(135deg,var(--p),#4c1d95);box-shadow:0 0 22px rgba(168,85,247,.7)}
.logout{background:none;border:1px solid var(--line);color:var(--p3);padding:8px 14px;border-radius:12px;font:inherit;cursor:pointer;transition:.2s}
.logout:hover{background:var(--glass)}
.scanbox{padding:26px;text-align:center;margin-bottom:18px}
.frame{position:relative;width:240px;height:240px;margin:0 auto 18px;display:grid;place-items:center;font-size:64px}
.frame i{position:absolute;width:38px;height:38px;border:4px solid var(--p);filter:drop-shadow(0 0 8px var(--p));animation:br 2s ease-in-out infinite}
.frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-top-left-radius:14px}
.frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-top-right-radius:14px}
.frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-bottom-left-radius:14px}
.frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-bottom-right-radius:14px}
@keyframes br{50%{transform:scale(.88);opacity:.6}}
.laser{position:absolute;left:8px;right:8px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,#fff,var(--p),transparent);box-shadow:0 0 18px 4px var(--p);top:8px;opacity:0}
.scanning .laser{opacity:1;animation:ls .8s ease-in-out infinite alternate}
@keyframes ls{to{top:calc(100% - 11px)}}
.scanning .frame{animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.06)}}
.frame video{position:absolute;inset:16px;width:calc(100% - 32px);height:calc(100% - 32px);object-fit:cover;border-radius:50%;transform:scaleX(-1);opacity:0;transition:.5s;background:#12072a}
.cam .frame video{opacity:1}.cam #fi{opacity:0}
.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);pointer-events:none}
.ring circle{fill:none;stroke:var(--p3);stroke-width:5;stroke-linecap:round;stroke-dasharray:691;stroke-dashoffset:691;filter:drop-shadow(0 0 8px var(--p))}
.ring.run circle{animation:rg 5s linear forwards}
@keyframes rg{to{stroke-dashoffset:0}}
.scanning.cam .frame video{box-shadow:0 0 40px var(--p)}
.cd{position:absolute;bottom:-6px;z-index:3;padding:4px 16px;border-radius:99px;background:rgba(0,0,0,.6);border:1px solid var(--line);font-size:15px;opacity:0;transition:.3s}
.scanning .cd{opacity:1}
.clr{margin-top:10px;background:none;border:1px solid rgba(251,113,133,.5);color:var(--out);padding:10px 18px;border-radius:14px;font:inherit;cursor:pointer;transition:.25s}
.clr:hover{background:rgba(251,113,133,.12);transform:translateY(-2px)}
.clr.sure{background:var(--out);color:#fff;animation:blink2 .6s infinite alternate}
@keyframes blink2{to{box-shadow:0 0 22px var(--out)}}
.lh{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px}.lh h2{margin:0}
.statusline{margin-bottom:6px;font-size:15px;color:var(--p3)}
h2{font-size:20px;margin:0 0 14px 4px;color:var(--p3)}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-bottom:18px}
.card{padding:20px;transition:.3s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 50px rgba(124,58,237,.6)}
.card.me-c{border-color:var(--p);box-shadow:0 0 30px rgba(168,85,247,.45)}
.card .nm{font-size:17px}.card .ch{font-size:13px;color:var(--p3);opacity:.75;margin:2px 0 12px}
.badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;font-size:14px;border:1px solid}
.badge::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}
.b-in{color:var(--ok);border-color:rgba(74,222,128,.5);background:rgba(74,222,128,.1)}
.b-in::before{animation:blink 1.1s infinite}
.b-out{color:var(--out);border-color:rgba(251,113,133,.5);background:rgba(251,113,133,.1)}
.b-no{color:#a1a1aa;border-color:rgba(161,161,170,.4);background:rgba(161,161,170,.08)}
@keyframes blink{50%{opacity:.25;transform:scale(.7)}}
.logs{padding:20px}
.log{display:flex;align-items:center;gap:14px;padding:14px;margin-bottom:10px;border-radius:16px;background:rgba(0,0,0,.28);border:1px solid var(--line);animation:slide .6s cubic-bezier(.2,1.2,.4,1) both}
@keyframes slide{from{opacity:0;transform:translateX(-50px) scale(.95)}to{opacity:1;transform:none}}
.log.new{animation:slide .6s both,glow 1.6s 2}
@keyframes glow{50%{box-shadow:0 0 28px var(--p)}}
.ic{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:20px}
.ic.in{background:rgba(74,222,128,.15);color:var(--ok)}.ic.out{background:rgba(251,113,133,.15);color:var(--out)}
.lt{flex:1;min-width:0}.lt b{font-size:16px}.lt small{display:block;color:var(--p3);opacity:.85;margin-top:3px;font-size:13px;font-variant-numeric:tabular-nums}
.empty{text-align:center;opacity:.6;padding:24px}
.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,120px);padding:14px 24px;border-radius:99px;z-index:9;transition:.5s cubic-bezier(.2,1.4,.4,1);white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<div class="grid"></div>
<div class="wrap">
  <div id="login" class="glass pop">
    <div class="logo">🎬</div>
    <h1>สแกนเข้ากอง - ออกกอง</h1>
    <div class="sub">กรอกรหัสผู้ใช้เพื่อเข้าสู่ระบบ</div>
    <input id="code" inputmode="numeric" maxlength="5" placeholder="•••••" autocomplete="off">
    <div class="err" id="err"></div>
    <button class="btn" id="go">เข้าสู่ระบบ</button>
  </div>

  <div id="app">
    <div class="glass top pop">
      <div class="me"><div class="av" id="av"></div><div><div id="mn"></div><small style="color:var(--p3)" id="mc"></small></div></div>
      <div class="clock" id="clock"></div>
      <button class="logout" id="lo">ออกจากระบบ</button>
    </div>
    <div class="glass scanbox pop" id="sb" style="animation-delay:.1s">
      <div class="frame"><i></i><i></i><i></i><i></i><svg class="ring" id="ring" viewBox="0 0 240 240"><circle cx="120" cy="120" r="110"/></svg><video id="vid" playsinline muted></video><span id="fi">🙂</span><div class="laser"></div><div class="cd" id="cd"></div></div>
      <div class="statusline" id="sl"></div>
      <button class="btn" id="scan"></button>
    </div>
    <h2>สถานะทุกคน</h2>
    <div class="people" id="people"></div>
    <div class="glass logs pop" style="animation-delay:.2s">
      <div class="lh"><h2>ประวัติการสแกน</h2><button class="clr" id="clr">🗑️ ล้างข้อมูล</button></div>
      <div id="logs"></div>
    </div>
  </div>
</div>
<div class="glass toast" id="toast"></div>

<script>
const USERS={
 "67671":{name:"ชลนธี ชื่นใส",ch:"NEWKUNG",ic:"ช"},
 "67672":{name:"ภาณุพงษ์ โตละหาน",ch:"EXDREAMNIGHT",ic:"ภ"},
 "67673":{name:"ปภาอร ชื่นใส",ch:"NONG NAMPRIK CHANNEL",ic:"ป"}
};
const $=id=>document.getElementById(id);
let cur=null,logs=[];
try{logs=JSON.parse(localStorage.getItem("gong_logs")||"[]")}catch(e){logs=[]}
function save(){try{localStorage.setItem("gong_logs",JSON.stringify(logs))}catch(e){}}
const MONTHS=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const p2=n=>String(n).padStart(2,"0");
function fmt(t){const d=new Date(t);return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()+543} เวลา ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())} น.`}
function status(code){for(let i=logs.length-1;i>=0;i--)if(logs[i].code===code)return logs[i];return null}
// bubbles
for(let i=0;i<16;i++){const b=document.createElement("div");b.className="bubble";const s=20+Math.random()*80;
 b.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;animation-duration:${9+Math.random()*12}s;animation-delay:${-Math.random()*15}s`;document.body.appendChild(b)}
// clock
setInterval(()=>{if(cur){const d=new Date();$("clock").textContent=`${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()+543} · ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`}},250);
function login(){
 const c=$("code").value.trim();
 if(!USERS[c]){$("err").textContent="รหัสไม่ถูกต้อง ลองใหม่อีกครั้ง";const l=$("login");l.classList.remove("shake");void l.offsetWidth;l.classList.add("shake");return}
 cur=c;$("login").style.display="none";$("app").style.display="block";
 const u=USERS[c];$("av").textContent=u.ic;$("mn").textContent=u.name;$("mc").textContent=u.ch;
 render();
}
function badge(s){
 if(!s)return `<span class="badge b-no">ยังไม่เข้ากอง</span>`;
 return s.type==="in"?`<span class="badge b-in">เข้ากองแล้ว</span>`:`<span class="badge b-out">ออกกองแล้ว</span>`;
}
function render(newId){
 const s=status(cur),isIn=s&&s.type==="in";
 $("sl").innerHTML="สถานะของคุณ: "+badge(s);
 const b=$("scan");b.className="btn"+(isIn?" out":"");b.textContent=isIn?"📤 สแกนใบหน้าออกกอง":"📥 สแกนใบหน้าเข้ากอง";
 $("people").innerHTML=Object.keys(USERS).map((c,i)=>{const u=USERS[c],st=status(c);
  return `<div class="glass card pop ${c===cur?"me-c":""}" style="animation-delay:${i*.12}s"><div class="nm">${u.name}</div><div class="ch">${u.ch}</div>${badge(st)}<div style="font-size:12px;margin-top:10px;color:var(--p3);opacity:.8">${st?fmt(st.t):"—"}</div></div>`}).join("");
 $("logs").innerHTML=logs.length?[...logs].reverse().map(l=>{const u=USERS[l.code],i=l.type==="in";
  return `<div class="log ${l.id===newId?"new":""}"><div class="ic ${i?"in":"out"}">${i?"➜":"⇦"}</div><div class="lt"><b>${u.name}</b> <span style="color:var(--p3);font-size:13px">(${u.ch})</span><small>${fmt(l.t)}</small></div>${i?'<span class="badge b-in">เข้ากองแล้ว</span>':'<span class="badge b-out">ออกกองแล้ว</span>'}</div>`}).join(""):`<div class="empty">ยังไม่มีประวัติการสแกน</div>`;
}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600)}
let busy=false;
const MSG=["กำลังเปิดกล้อง…","กำลังวิเคราะห์ใบหน้า…","กำลังเทียบข้อมูล…","ยืนยันตัวตน…"];
async function scan(){
 if(busy)return;busy=true;
 const isIn=status(cur)&&status(cur).type==="in";
 let stream=null;
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});
  $("vid").srcObject=stream;await $("vid").play().catch(()=>{});$("sb").classList.add("cam")}
 catch(e){toast("เปิดกล้องไม่ได้ — สแกนจำลองต่อ")}
 $("sb").classList.add("scanning");$("fi").textContent="🔍";
 const rg=$("ring");rg.classList.remove("run");void rg.getBoundingClientRect();rg.classList.add("run");
 let n=5;$("cd").textContent=MSG[0]+" "+n;
 const iv=setInterval(()=>{n--;if(n>0)$("cd").textContent=MSG[Math.min(5-n,3)]+" "+n},1000);
 setTimeout(()=>{
  clearInterval(iv);
  if(stream)stream.getTracks().forEach(t=>t.stop());
  $("vid").srcObject=null;
  const e={id:Date.now(),code:cur,type:isIn?"out":"in",t:Date.now()};
  logs.push(e);save();
  $("sb").classList.remove("scanning","cam");rg.classList.remove("run");$("fi").textContent="✅";
  toast((isIn?"ออกกองแล้ว ✓ ":"เข้ากองแล้ว ✓ ")+USERS[cur].name);
  render(e.id);
  setTimeout(()=>{$("fi").textContent="🙂";busy=false},1200);
 },5000);
}
let clrT=null;
$("clr").onclick=()=>{const c=$("clr");
 if(!c.classList.contains("sure")){c.classList.add("sure");c.textContent="⚠️ กดอีกครั้งเพื่อยืนยันล้าง";clrT=setTimeout(()=>{c.classList.remove("sure");c.textContent="🗑️ ล้างข้อมูล"},3500);return}
 clearTimeout(clrT);c.classList.remove("sure");c.textContent="🗑️ ล้างข้อมูล";
 logs=[];save();render();toast("ล้างข้อมูลทั้งหมดแล้ว");};
$("go").onclick=login;
$("code").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
$("scan").onclick=scan;
$("lo").onclick=()=>{cur=null;$("app").style.display="none";$("login").style.display="block";$("code").value="";$("err").textContent=""};
</script>
</body>
</html>
